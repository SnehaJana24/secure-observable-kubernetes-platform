apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-observable-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secure-observable-app
  template:
    metadata:
      labels:
        app: secure-observable-app
    spec:
      containers:
        - name: secure-observable-app
          image: secure-observable-app:1.4
          imagePullPolicy: Never
          ports:
            - containerPort: 3000

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5